<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Install for</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
*{box-sizing:border-box;margin:0;user-select:none;scrollbar-width:thin}
html,body{height:100%;overflow:hidden;background:transparent}
body{font:13px system-ui,'Segoe UI',sans-serif;color:#ece9f7;display:grid;place-items:center;background:rgba(0,0,0,.6);opacity:0;transition:opacity .2s}
body.on{opacity:1}
#box{width:min(460px,92vw);max-height:84vh;display:flex;flex-direction:column;gap:12px;padding:24px;border-radius:26px;border:1px solid transparent;
  background:linear-gradient(#14101f,#14101f) padding-box,linear-gradient(90deg,rgba(150,30,40,.85),rgba(30,60,150,.85)) border-box}
h2{font-size:18px}
#p{color:#8c85a6;font-size:13px;margin-top:-6px;display:flex;align-items:center;gap:8px}#p:empty{display:none}#p b{color:#ece9f7}
#p select{background:rgba(255,255,255,.07);color:#ece9f7;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 12px;font:inherit;outline:0}#p option{background:#14101f}
#q{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:10px 16px;color:#ece9f7;outline:0;font:inherit;user-select:text}
#q:focus{border-color:rgba(120,140,255,.65)}
#tools{display:none;align-items:center;gap:8px}
#tools small{margin-left:auto;color:#8c85a6}
#l{overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:80px}
.i{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);cursor:pointer;transition:.2s}
.i:hover{background:rgba(255,255,255,.1)}
.i.on{background:linear-gradient(90deg,rgba(80,20,24,.55),rgba(22,34,80,.55))}
.c{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.3);display:grid;place-items:center;font-size:11px;flex:none}
body.multi .c{border-radius:6px}
.i.on .c{background:#8aa4ff;border-color:#8aa4ff;color:#0b0912}
.e{color:#8c85a6;padding:10px}
.r{display:flex;justify-content:flex-end;gap:8px}
button{font:inherit;color:inherit;border:0;cursor:pointer;padding:10px 20px;border-radius:999px;font-weight:600;background:linear-gradient(90deg,rgba(80,20,24,.9),rgba(22,34,80,.9))}
button.g{background:rgba(255,255,255,.08)}
button.s{padding:6px 14px;font-weight:500;font-size:12px}
button:disabled{opacity:.4;cursor:default}
</style></head><body>
<div id="box"><h2 id="t"></h2><div id="p"></div><input id="q" placeholder="Search (type a name to select it)" spellcheck="false" autocomplete="off">
<div id="tools"><button class="g s" id="all">Select all</button><button class="g s" id="none">Unselect all</button><small id="cnt"></small></div>
<div id="l"></div>
<div class="r"><button class="g" id="no">Cancel</button><button id="ok">Install</button></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// ---- character list logic shared by the in-app dialog and the browser overlay ----
// single: one choice. multi: many (Select all / Unselect all). Typing selects by name:
// the exact name first (hayate before hayate_boss), else the first name that starts with the text.
function PKcore(o){
  const items=o.items||[],multi=!!o.multi,init=Array.isArray(o.selected)?o.selected:(o.selected?[o.selected]:[]);
  const low=s=>String(s).toLowerCase();
  let q='',cand=null,from='init',chosen=new Set(init);
  const match=t=>{t=low(t).trim();if(!t)return null;const cs=items.filter(i=>i.c);
    return cs.find(i=>low(i.l)===t)||cs.find(i=>low(i.l).startsWith(t))||null};
  const visible=()=>{const t=low(q).trim();return items.filter(i=>!t||low(i.l).includes(t))};
  const sel=()=>{ // single mode: the one chosen value ('' = none); a choice hidden by the search never counts
    const v=(q.trim()?(cand||[...chosen][0]):[...chosen][0])||'';return visible().some(i=>i.v===v)?v:''};
  const picked=()=>[...chosen].concat(cand&&!chosen.has(cand)?[cand]:[]);
  return{
    visible,
    shown:v=>multi?(chosen.has(v)||cand===v):sel()===v,
    setQuery(t){q=t;const m=match(t);
      if(multi){cand=m&&!chosen.has(m.v)?m.v:null;return}
      if(t.trim()){if(from!=='click')chosen=new Set()}else if(from!=='click')chosen=new Set(init);
      cand=m?m.v:null},
    click(v){
      if(multi){if(chosen.has(v)||cand===v){chosen.delete(v);if(cand===v)cand=null}else chosen.add(v);return}
      from='click';chosen=new Set([v]);cand=null},
    enter(){ // multi: Enter keeps the typed match and clears the box for the next name; Enter on an empty box confirms
      if(multi&&cand){chosen.add(cand);cand=null;q='';return'cleared'}return'confirm'},
    all(){visible().filter(i=>i.c).forEach(i=>chosen.add(i.v));cand=null},
    none(){const vis=new Set(visible().map(i=>i.v));[...chosen].forEach(v=>{if(vis.has(v))chosen.delete(v)});if(cand&&vis.has(cand))cand=null},
    count:()=>multi?picked().length:(sel()?1:0),
    canOk:()=>multi?(!!o.allowEmpty||picked().length>0):!!sel(),
    result:()=>multi?picked():sel(),
  }}

let k=null,multi=false;
// which profile the mod goes to: a choice when there are several, plain text when there is one
const curProf=()=>{const s=$('#ps');return s?s.value:($('#p').dataset.v||undefined)};
function drawProf(o){const el=$('#p'),ps=o.profiles||[];el.dataset.v=o.profile||'';
  if(!o.profile){el.innerHTML='';return}
  el.innerHTML=ps.length>1?'Profile: <select id="ps">'+ps.map(p=>'<option'+(p===o.profile?' selected':'')+' value="'+esc(p)+'">'+esc(p)+'</option>').join('')+'</select>':'Profile: <b>'+esc(o.profile)+'</b>'}
const fin=v=>pk.done(v,curProf());
const draw=()=>{
  $('#l').innerHTML=k.visible().map(i=>`<div class="i ${k.shown(i.v)?'on':''}" data-v="${esc(i.v)}"><div class="c">${k.shown(i.v)?'&#10003;':''}</div>${esc(i.l)}</div>`).join('')||'<div class="e">No match</div>';
  $('#ok').disabled=!k.canOk();$('#cnt').textContent=multi?k.count()+' selected':'';
  const on=$('#l .on');if(on)on.scrollIntoView({block:'nearest'})};
pk.onShow(o=>{k=PKcore(o);multi=!!o.multi;document.body.classList.toggle('multi',multi);
  $('#t').textContent=o.title||'';drawProf(o);$('#ok').textContent=o.okLabel||'Install';$('#tools').style.display=multi?'flex':'none';$('#q').value='';draw();
  requestAnimationFrame(()=>{document.body.classList.add('on');$('#q').focus()})});
$('#l').addEventListener('click',e=>{const i=e.target.closest('.i');if(i&&k){k.click(i.dataset.v);draw()}});
$('#l').addEventListener('dblclick',e=>{if(multi||!k)return;const i=e.target.closest('.i');if(i){k.click(i.dataset.v);if(k.canOk())fin(k.result())}});
$('#q').addEventListener('input',()=>{k.setQuery($('#q').value);draw()});
$('#q').addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!k)return;e.preventDefault();
  const r=k.enter();if(r==='cleared'){$('#q').value='';k.setQuery('');draw()}else if(k.canOk())fin(k.result())});
$('#all').onclick=()=>{k.all();draw()};$('#none').onclick=()=>{k.none();draw()};
$('#ok').onclick=()=>{if(k&&k.canOk())fin(k.result())};
$('#no').onclick=()=>pk.done(null);
document.body.addEventListener('mousedown',e=>{if(e.target===document.body)pk.done(null)});
addEventListener('keydown',e=>{if(e.key==='Escape')pk.done(null)});
pk.ready();
</script></body></html>
